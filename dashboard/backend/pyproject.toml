[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-lab-dashboard"
version = "0.1.0"
description = "Read-only Batch 001 evidence explorer; no research execution imports"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "lab3"]

[tool.uv.sources]
lab3 = { path = "../../phase3", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
    "httpx2>=2.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dashboard_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
