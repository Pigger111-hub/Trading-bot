[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-research-lab"
version = "0.1.0"
description = "Auditable, paper-only autonomous research lab coordinated by Hermes"
requires-python = ">=3.12,<3.13"
dependencies = ["backtesting>=0.6.5,<0.7", "pandas>=2.2,<3", "pyarrow>=19,<24", "requests>=2.32,<3", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
trading-lab = "trading_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S307", "S602"]
