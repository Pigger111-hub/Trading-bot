[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab3"
version = "0.1.0"
description = "Bounded Hermes research and experiment planning; no trading engine"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<1"]

[tool.hatch.build.targets.wheel]
packages = ["lab3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
